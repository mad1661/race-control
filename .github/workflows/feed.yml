name: Run order feed

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub runs this best-effort; expect 5-15 min in practice
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: run-order-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.gen.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: gen
        run: node rss/generate.js
      - name: Commit feed and snapshot
        if: steps.gen.outputs.changed == 'true'
        run: |
          git config user.name "race-control-feed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml rss/state days.json
          git diff --cached --quiet || git commit -m "Run order feed update"
          git pull --rebase --quiet && git push
      # Run health: generate.js writes rss/state/last-run.json on EVERY exit (ok or not).
      # Commit it when the job failed, when it recovers, or when the error text changes,
      # so a broken feed is visible in the repo (and GitHub emails the failed run).
      # Healthy no-change runs do not commit (keeps history quiet).
      - name: Record run health
        if: always()
        run: |
          f=rss/state/last-run.json
          [ -f "$f" ] || { echo "no $f (script did not start)"; exit 0; }
          cat "$f"
          now=$(node -e 'const j=require("./"+process.argv[1]);console.log(j.ok+"|"+(j.error||""))' "$f")
          was=$(git show HEAD:$f 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(j.ok+"|"+(j.error||""))}catch(e){console.log("none")}})')
          if [ "$now" = "$was" ]; then echo "health unchanged ($now); not committing"; exit 0; fi
          git config user.name "race-control-feed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git diff --cached --quiet && exit 0
          git commit -m "Feed health: ${now%%|*}" --quiet
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && exit 0; sleep 5; done
          echo "::warning::could not push last-run.json"

  deploy:
    needs: feed
    if: needs.feed.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble site
        run: mkdir _site && cp index.html feed.xml _site/ && { cp days.json _site/ 2>/dev/null || true; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
